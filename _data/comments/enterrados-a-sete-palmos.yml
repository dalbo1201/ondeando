    fiquei curiosa com a série pelos seus comentários! sempre acho que alguns temas são pouco explorados em séries mais comerciais em geral, o luto é um deles. pessoas idosas é outro (motivo pelo qual eu amo a série *grace e frankie* de paixão!). acho legal esse fo o em algo pouco abordado, porque nada nunca tem uma faceta só a se explorar, e isso acaba sempre em desenvolvimentos interessantes de personagem.

